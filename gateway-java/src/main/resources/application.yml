server:
  port: 8080

spring:
  application:
    name: gateway-java
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: "1"
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/nl2sql_ops?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:nl2sql_root}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

gateway:
  ratelimit:
    global-qps: ${GLOBAL_QPS:200}
  cache:
    result-ttl-seconds: 1800

engine:
  base-url: ${ENGINE_BASE_URL:http://127.0.0.1:8000}
  health-path: /api/v1/health
  connect-timeout-ms: 3000
  response-timeout-ms: 180000   # LLM 长流水线，超时交给 TimeLimiter 而不是连接层

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,prometheus
      path-mapping:
        prometheus: metrics
  endpoint:
    health:
      show-details: always

resilience4j:
  circuitbreaker:
    instances:
      engine:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
  timelimiter:
    instances:
      engine:
        timeoutDuration: 180s
        cancelRunningFuture: true
